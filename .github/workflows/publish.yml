name: Publish

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
      - run: yarn install
      - run: yarn build
      - run: npm pack --dry-run
      - run: npm publish
        if: startsWith(github.ref, 'refs/tags/')
