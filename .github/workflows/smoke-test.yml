name: Production Smoke Test

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 17 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: yarn install --frozen-lockfile
      - name: Run production smoke test
        env:
          EDILKAMIN_USERNAME: ${{ secrets.EDILKAMIN_USERNAME }}
          EDILKAMIN_PASSWORD: ${{ secrets.EDILKAMIN_PASSWORD }}
          EDILKAMIN_MAC: ${{ secrets.EDILKAMIN_MAC }}
        run: |
          if [ -z "$EDILKAMIN_USERNAME" ] || [ -z "$EDILKAMIN_PASSWORD" ] || [ -z "$EDILKAMIN_MAC" ]; then
            echo "::error::The production-smoke Environment is missing one or more required secrets"
            exit 1
          fi
          yarn test:smoke
